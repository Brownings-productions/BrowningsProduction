about_title:
  en: "Engineer at work. Builder at home."
  nb: "Ingeniør på jobb. Bygger hjemme."

about:
  - en: "I work as a project engineer in the SRO department at Tratec Norcon, with building automation: the control, regulation and monitoring of technical systems."
    nb: "Jeg jobber som prosjektingeniør i SRO-avdelingen hos Tratec Norcon, med byggautomasjon: styring, regulering og overvåking av tekniske anlegg."
  - en: "Home is a farm in Øyslebø, Lindesnes. That is where the projects happen: caring for young forest, setting up solar power, building a workshop and forge, and turning an old motorbike into a café racer."
    nb: "Hjemme er en gård på Øyslebø i Lindesnes. Det er der prosjektene skjer: ungskogpleie, solkraft, et verksted med smie, og en gammel motorsykkel som skal bli café racer."
  - en: "I like to understand how things work and then build them myself. The next step is turning ideas into real products."
    nb: "Jeg liker å forstå hvordan ting fungerer, og så bygge dem selv. Neste steg er å gjøre ideer om til ekte produkter."

