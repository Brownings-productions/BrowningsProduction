hero_lead:
  en: "Project engineer by day, builder the rest of the time. I live on a farm in southern Norway and work on forestry, solar power, a café racer, a forge and an AI-run smart house, and I document all of it here."
  nb: "Prosjektingeniør på dagtid, bygger resten av tiden. Jeg bor på en gård på Sørlandet og jobber med skogpleie, solkraft, en café racer, smie og et AI-styrt smarthus, og dokumenterer alt her."

job:
  en: "Project engineer, SRO · Tratec Norcon"
