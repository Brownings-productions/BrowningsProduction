<!doctype html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title.en %}{{ page.title.en }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.lead.en %}{{ page.lead.en | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:title" content="{% if page.title.en %}{{ page.title.en }} – {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <script>
    /* Apply saved language and theme before the page paints (no flash). */
    (function () {
      var d = document.documentElement, th = 'dark', lg = 'en';
      try { th = localStorage.getItem('bp-theme') || th; lg = localStorage.getItem('bp-lang') || lg; } catch (e) {}
      d.setAttribute('data-theme', th); d.setAttribute('data-lang', lg); d.lang = lg === 'no' ? 'nb' : 'en';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e07a3a'/%3E%3Ctext x='16' y='23' font-family='Impact,sans-serif' font-size='18' font-weight='900' text-anchor='middle' fill='%23151a17'%3EBP%3C/text%3E%3C/svg%3E">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
